name: Virtual channel automatic read proof
on:
  push:
    branches:
      - proof/netty-yamux-red-232805
      - proof/netty-yamux-green-232805
      - proof/netty-yamux-revert-232805
permissions:
  contents: read
jobs:
  automatic-read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Run automatic-read policy regressions
        run: >-
          ./mvnw -B -ntp -pl transport -am test
          -Dtest=DefaultChannelPipelineAutoReadTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload exact test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-read-${{ github.sha }}
          path: |
            transport/target/surefire-reports/TEST-io.netty.channel.DefaultChannelPipelineAutoReadTest.xml
            transport/target/surefire-reports/io.netty.channel.DefaultChannelPipelineAutoReadTest.txt
          if-no-files-found: error

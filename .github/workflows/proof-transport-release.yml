name: Transport-only release preparation
on:
  push:
    branches:
      - proof/netty-transport-release-232805
permissions:
  contents: read
jobs:
  transport-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Build full transport artifact and focused regressions
        run: |
          ./mvnw -B -ntp -f transport/pom.xml package help:effective-pom dependency:tree \
            -Dtest=DefaultChannelPipelineAutoReadTest \
            -Doutput="$PWD/transport/target/effective-pom.xml" \
            -DoutputFile="$PWD/transport/target/dependencies.txt"
      - name: Stage candidate and verify its metadata
        run: |
          mkdir -p release provenance
          version=4.2.10.3-codexcoder21
          cp "transport/target/netty-transport-$version.jar" release/
          cp "transport/target/netty-transport-$version-sources.jar" release/
          cp transport/pom.xml "release/netty-transport-$version.pom"
          cp transport/target/effective-pom.xml transport/target/dependencies.txt provenance/
          cp transport/target/surefire-reports/TEST-io.netty.channel.DefaultChannelPipelineAutoReadTest.xml provenance/
          git rev-parse HEAD > provenance/build-source-sha.txt
          printf '%s\n' '2108075d1660b8a4560db3090eb8c26965e0be21' > provenance/release-source-sha.txt
          printf '%s\n' '4cc98736c3947bc93122e0b64e0bd8fc970c6437' > provenance/base-source-sha.txt
          git diff --exit-code 2108075d1660b8a4560db3090eb8c26965e0be21 -- README.md transport/pom.xml transport/src/main transport/src/test/java/io/netty/channel/DefaultChannelPipelineAutoReadTest.java
          git diff netty-4.2.10.Final -- transport/src/main/java/io/netty/channel/AbstractChannel.java transport/src/main/java/io/netty/channel/DefaultChannelPipeline.java > provenance/automatic-read-hook.patch
          printf '%s\n' './mvnw -B -ntp -f transport/pom.xml package help:effective-pom dependency:tree -Dtest=DefaultChannelPipelineAutoReadTest -Doutput="$PWD/transport/target/effective-pom.xml" -DoutputFile="$PWD/transport/target/dependencies.txt"' > provenance/maven-command.txt
          curl -fsSL --max-time 60 https://repo.maven.apache.org/maven2/io/netty/netty-transport/4.2.10.Final/netty-transport-4.2.10.Final.jar -o provenance/upstream-transport.jar
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          import zipfile

          version = '4.2.10.3-codexcoder21'
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('provenance/effective-pom.xml').getroot()
          assert root.findtext('m:groupId', namespaces=ns) == 'io.netty'
          assert root.findtext('m:artifactId', namespaces=ns) == 'netty-transport'
          assert root.findtext('m:version', namespaces=ns) == version
          assert root.findtext('m:parent/m:version', namespaces=ns) == '4.2.10.Final'
          dependencies = []
          for dep in root.findall('m:dependencies/m:dependency', ns):
              item = {name: dep.findtext('m:' + name, namespaces=ns) for name in ('groupId', 'artifactId', 'version', 'scope')}
              dependencies.append(item)
              if item['groupId'] == 'io.netty':
                  assert item['version'] != version, item
          for artifact in ('netty-common', 'netty-buffer', 'netty-resolver', 'netty-testsuite-common'):
              matches = [d for d in dependencies if d['groupId'] == 'io.netty' and d['artifactId'] == artifact]
              assert len(matches) == 1 and matches[0]['version'] == '4.2.10.Final', matches
          Path('provenance/resolved-dependencies.json').write_text(json.dumps(dependencies, indent=2) + '\n')

          with zipfile.ZipFile('provenance/upstream-transport.jar') as upstream, zipfile.ZipFile(f'release/netty-transport-{version}.jar') as candidate:
              base_entries = set(upstream.namelist())
              candidate_entries = set(candidate.namelist())
              missing_classes = sorted(n for n in base_entries - candidate_entries if n.endswith('.class'))
              assert not missing_classes, missing_classes
              assert len([n for n in candidate_entries if n.endswith('.class')]) > 100
              protected_resources = sorted(n for n in base_entries if n.startswith(('META-INF/services/', 'META-INF/native-image/')) and not n.endswith('/'))
              for name in protected_resources:
                  assert name in candidate_entries and upstream.read(name) == candidate.read(name), name
              base_multi_release = b'Multi-Release: true' in upstream.read('META-INF/MANIFEST.MF')
              candidate_multi_release = b'Multi-Release: true' in candidate.read('META-INF/MANIFEST.MF')
              assert base_multi_release == candidate_multi_release
              for name in base_entries:
                  if name.startswith('META-INF/versions/'):
                      assert name in candidate_entries, name
              version_properties = candidate.read('META-INF/io.netty.versions.properties').decode()
              assert 'netty-transport.version=' + version in version_properties, version_properties
              Path('provenance/candidate-manifest.txt').write_bytes(candidate.read('META-INF/MANIFEST.MF'))
              Path('provenance/candidate-entries.txt').write_text('\n'.join(sorted(candidate_entries)) + '\n')
              Path('provenance/metadata-summary.json').write_text(json.dumps({
                  'class_count': len([n for n in candidate_entries if n.endswith('.class')]),
                  'upstream_class_count': len([n for n in base_entries if n.endswith('.class')]),
                  'missing_upstream_classes': missing_classes,
                  'preserved_service_and_native_image_resources': protected_resources,
                  'multi_release': candidate_multi_release,
              }, indent=2) + '\n')
          with zipfile.ZipFile(f'release/netty-transport-{version}-sources.jar') as sources:
              assert len([n for n in sources.namelist() if n.endswith('.java')]) > 100
              assert b'protected boolean shouldAutoRead()' in sources.read('io/netty/channel/DefaultChannelPipeline.java')
          result = ET.parse('provenance/TEST-io.netty.channel.DefaultChannelPipelineAutoReadTest.xml').getroot()
          assert result.attrib['tests'] == '4', result.attrib
          assert all(result.attrib.get(name, '0') == '0' for name in ('failures', 'errors', 'skipped')), result.attrib
          checksums = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('release').iterdir())}
          Path('provenance/sha256.json').write_text(json.dumps(checksums, indent=2) + '\n')
          print(json.dumps(checksums, indent=2))
          PY
          javap -protected -classpath "release/netty-transport-$version.jar" io.netty.channel.DefaultChannelPipeline > provenance/pipeline-api.txt
          grep 'protected boolean shouldAutoRead();' provenance/pipeline-api.txt
          rm provenance/upstream-transport.jar
      - name: Upload candidate files for review only
        uses: actions/upload-artifact@v4
        with:
          name: netty-transport-4.2.10.3-codexcoder21-candidate
          path: release/
          if-no-files-found: error
      - name: Upload build provenance and focused XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netty-transport-4.2.10.3-codexcoder21-provenance
          path: |
            provenance/
            transport/target/surefire-reports/TEST-io.netty.channel.DefaultChannelPipelineAutoReadTest.xml
            transport/target/surefire-reports/io.netty.channel.DefaultChannelPipelineAutoReadTest.txt
          if-no-files-found: error
